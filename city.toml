[workspace]
provider = "antigravity"
max_active_sessions = 12

[workspace.env]
TZ = "America/Los_Angeles"
GC_OPERATOR_TZ = "America/Los_Angeles"
OPENCODE_EXPERIMENTAL_BASH_DEFAULT_TIMEOUT_MS = "600000"

[daemon]
nudge_dispatcher = "supervisor"

[providers]
[providers.antigravity]
base = "builtin:antigravity"
ready_delay_ms = 0
args_append = ["--mode", "accept-edits", "--dangerously-skip-permissions"]

[providers.local-litellm]
base = "builtin:opencode"
ready_delay_ms = 100
[providers.local-litellm.env]
OPENAI_API_BASE = "http://10.82.0.3:8000/v1"
OPENAI_MODEL = "nvidia/llama-3.3-nemotron-super-49b-v1.5"
OPENAI_API_KEY = "none"
OPENCODE_EXPERIMENTAL_BASH_DEFAULT_TIMEOUT_MS = "600000"

[providers.local-nemotron]
base = "builtin:opencode"
ready_delay_ms = 100
[providers.local-nemotron.env]
OPENAI_API_BASE = "http://10.82.0.3:8000/v1"
OPENAI_MODEL = "nvidia/llama-3.3-nemotron-super-49b-v1.5"
OPENAI_API_KEY = "none"
OPENCODE_EXPERIMENTAL_BASH_DEFAULT_TIMEOUT_MS = "600000"

[providers.local-fast]
base = "builtin:opencode"
ready_delay_ms = 50
[providers.local-fast.env]
OPENAI_API_BASE = "http://10.82.0.3:8000/v1"
OPENAI_MODEL = "nvidia/llama-3.3-nemotron-super-49b-v1.5"
OPENAI_API_KEY = "none"
OPENCODE_REASONING_EFFORT = "none"
OPENCODE_EXPERIMENTAL_BASH_DEFAULT_TIMEOUT_MS = "600000"

[providers.local-general]
base = "builtin:opencode"
ready_delay_ms = 100
[providers.local-general.env]
OPENAI_API_BASE = "http://10.82.0.3:8000/v1"
OPENAI_MODEL = "nvidia/llama-3.3-nemotron-super-49b-v1.5"
OPENAI_API_KEY = "none"
OPENCODE_REASONING_EFFORT = "medium"
OPENCODE_EXPERIMENTAL_BASH_DEFAULT_TIMEOUT_MS = "600000"

[providers.local-coder]
base = "builtin:opencode"
ready_delay_ms = 100
[providers.local-coder.env]
OPENAI_API_BASE = "http://10.82.0.3:8000/v1"
OPENAI_MODEL = "nvidia/llama-3.3-nemotron-super-49b-v1.5"
OPENAI_API_KEY = "none"
OPENCODE_REASONING_EFFORT = "high"
OPENCODE_EXPERIMENTAL_BASH_DEFAULT_TIMEOUT_MS = "600000"


[defaults]
[defaults.rig]
[defaults.rig.imports]
[defaults.rig.imports.gc]
source = "https://github.com/gastownhall/gascity-packs/tree/main/gascity/roles"
version = "sha:556effb4b2c5275063d145b783271f6608d09e42"

[[named_session]]
name = "cos"
template = "cos"
mode = "always"

[[named_session]]
name = "colt-sysadmin"
template = "colt-sysadmin"
dir = "rigs/suitcase-ai"
mode = "always"

[[named_session]]
