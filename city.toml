[workspace]
provider = "antigravity"

[providers]
[providers.antigravity]
base = "builtin:antigravity"
ready_delay_ms = 0

[providers.local-litellm]
base = "builtin:opencode"
ready_delay_ms = 100
[providers.local-litellm.env]
OPENAI_API_BASE = "http://10.82.0.3:8000/v1"
OPENAI_MODEL = "nvidia/llama-3.3-nemotron-super-49b-v1.5"
OPENAI_API_KEY = "none"

[providers.local-nemotron]
base = "builtin:opencode"
ready_delay_ms = 100
[providers.local-nemotron.env]
OPENAI_API_BASE = "http://10.82.0.3:8000/v1"
OPENAI_MODEL = "nvidia/llama-3.3-nemotron-super-49b-v1.5"
OPENAI_API_KEY = "none"

[defaults]
[defaults.rig]
[defaults.rig.imports]
[defaults.rig.imports.gc]
source = "https://github.com/gastownhall/gascity-packs/tree/main/gascity/roles"
version = "sha:3b3b89f2011e06d84459aa7bea1552382f13930a"

[[named_session]]
name = "cos"
template = "cos"
mode = "always"

[[named_session]]
name = "colt-sysadmin"
template = "colt-sysadmin"
dir = "rigs/suitcase-ai"
mode = "always"

[[named_session]]
name = "s3-operations"
template = "s3-operations"
mode = "always"

[[named_session]]
name = "s6-signal"
template = "s6-signal"
mode = "always"

[[rigs]]
name = "suitcase-ai"
prefix = "sa"
default_branch = "main"
[rigs.imports]
[rigs.imports.gc]
source = "https://github.com/gastownhall/gascity-packs/tree/main/gascity/roles"
version = "sha:3b3b89f2011e06d84459aa7bea1552382f13930a"

[[rigs]]
name = "go_template_rule"
default_branch = "main"
[rigs.imports]
[rigs.imports.gc]
source = "https://github.com/gastownhall/gascity-packs/tree/main/gascity/roles"
version = "sha:3b3b89f2011e06d84459aa7bea1552382f13930a"

[[rigs]]
name = "colt-utils"
prefix = "cu"
default_branch = "main"
provider = "local-litellm"
[rigs.imports]
[rigs.imports.gc]
source = "https://github.com/gastownhall/gascity-packs/tree/main/gascity/roles"
version = "sha:3b3b89f2011e06d84459aa7bea1552382f13930a"

[[rigs]]
name = "colt-results"
prefix = "cr"
default_branch = "main"
[rigs.imports]
[rigs.imports.gc]
source = "https://github.com/gastownhall/gascity-packs/tree/main/gascity/roles"
version = "sha:3b3b89f2011e06d84459aa7bea1552382f13930a"

[[rigs]]
name = "a-staff"
prefix = "as"
default_branch = "main"
[rigs.imports]
[rigs.imports.gc]
source = "https://github.com/gastownhall/gascity-packs/tree/main/gascity/roles"
version = "sha:3b3b89f2011e06d84459aa7bea1552382f13930a"

[beads]
[beads.policies]
[beads.policies.order_tracking]
delete_after_close = "1h"

[session]
provider = "herdr"

[dolt]
port = 0
max_connections = 0
read_timeout_millis = 300000
write_timeout_millis = 0
